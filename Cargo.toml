[package]
name = "womic-mic"
version = "0.2.0"
edition = "2021"
description = "WO Mic (Android) as a system microphone on Linux and Windows, with RNNoise denoise"

[lib]
name = "womic_mic"
path = "src/lib.rs"

[features]
default = []
gui = ["dep:gtk4", "dep:ksni", "dep:eframe"]

[[bin]]
name = "womic-mic"
path = "src/main.rs"

[[bin]]
name = "womic-mic-gui"
path = "src/bin/gui.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
gtk4 = { version = "0.11", optional = true }
ksni = { version = "0.3", features = ["blocking"], optional = true }

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"], optional = true }

[dependencies]
ctrlc = "3.4"
nnnoiseless = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
