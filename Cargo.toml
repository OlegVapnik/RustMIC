[package]
name = "RustMIC"
version = "0.3.0"
edition = "2021"
description = "WO Mic (Android) as a system microphone on Linux and Windows, with RNNoise denoise"

[lib]
name = "rustmic_mic"
path = "src/lib.rs"

[features]
default = []
gui = ["dep:ksni", "dep:eframe", "dep:tray-icon", "dep:egui_extras", "dep:image"]

[[bin]]
name = "RustMIC"
path = "src/main.rs"

[[bin]]
name = "RustMIC-gui"
path = "src/bin/gui.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ksni = { version = "0.3", features = ["blocking"], optional = true }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"], optional = true }

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow"], optional = true }
tray-icon = { version = "0.21", optional = true }

[dependencies]
ctrlc = "3.4"
egui_extras = { version = "0.37", features = ["file", "image"], optional = true }
image = { version = "0.25", features = ["jpeg", "png"], optional = true }
interprocess = "2.4"
nnnoiseless = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
